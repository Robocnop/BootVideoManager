# Pushing a tag vX.Y.Z builds the Windows installers and portable .exe (x64 and ARM64), the Linux archive and the
# Flatpak bundle, then attaches them with their SHA-256 to the GitHub release of that tag. Tags with a suffix (v1.1.0-beta) become
# pre-releases, which the in-app updater ignores; notes come from docs/release-notes/<tag>.md when present.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.5.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/BootVideoManager.App/BootVideoManager.App.csproj -getProperty:Version).Trim()
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match <Version>$version</Version> in Directory.Build.props." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Test, publish and build the installer
        shell: pwsh
        run: ./build/publish.ps1 -Runtime win-x64,win-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/publish/*-setup.exe
            artifacts/publish/*-portable.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test and publish
        run: bash build/publish.sh linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/publish/*.tar.gz
          if-no-files-found: error

  # Linux package: a signed Flatpak repository published on GitHub Pages (robocnop.github.io/BootVideoManager), and a
  # .flatpak bundle pointing at it. Whoever installs the bundle (or the .flatpakref) gets later releases through their
  # software center / `flatpak update`. The previous release is pulled back first so updates download as deltas.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      APP_ID: io.github.Robocnop.BootVideoManager
      SITE_URL: https://robocnop.github.io/BootVideoManager
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-

      - name: Import the repository signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is missing."; exit 1; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')" >> "$GITHUB_ENV"

      - name: Start from the published repository
        run: |
          command -v ostree > /dev/null || dnf install -y ostree
          ostree init --repo=repo --mode=archive-z2
          ostree remote add --repo=repo --no-gpg-verify published "$SITE_URL/repo"
          ostree pull --repo=repo --mirror --depth=1 published "app/$APP_ID/x86_64/stable" "runtime/$APP_ID.Locale/x86_64/stable" \
            || echo "No published repository yet: starting a new one."

      - name: Build into the repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean --ccache \
            --default-branch=stable --repo=repo --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            build-dir "packaging/flatpak/$APP_ID.yml"
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=2 \
            --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" --title="Boot Video Manager" repo

      - name: Bundle and site
        run: |
          flatpak build-bundle --repo-url="$SITE_URL/repo/" --gpg-keys=packaging/flatpak/boot-video-manager.gpg \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "BootVideoManager-${TAG#v}-x86_64.flatpak" "$APP_ID" stable
          bash packaging/flatpak/make-site.sh repo site "$SITE_URL"
          cp "site/$APP_ID.flatpakref" "BootVideoManager.flatpakref"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            *.flatpak
            BootVideoManager.flatpakref
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  release:
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Not the github-pages artifact (the Flatpak repository site).
          pattern: '{windows,linux,flatpak}'
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            args=(--title "Boot Video Manager ${TAG#v}")
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            if [[ -f "docs/release-notes/$TAG.md" ]]; then args+=(--notes-file "docs/release-notes/$TAG.md"); else args+=(--generate-notes); fi
            gh release create "$TAG" dist/* "${args[@]}"
          fi

  pages:
    needs: release
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
