# Build and test on every push and pull request, on Windows and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet build BootVideoManager.slnx -c Release

      - run: dotnet test --solution BootVideoManager.slnx -c Release --no-build
